name: Update news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        run: python scripts/fetch_news.py

      - name: Save news.json
        run: |
          if [ -n "$(git status --porcelain docs/news.json)" ]; then
            git config user.name "news-desk-bot"
            git config user.email "news-desk-bot@users.noreply.github.com"
            git add docs/news.json
            git commit -m "Update headlines"
            git push
          else
            echo "No changes."
          fi
