name: Update news

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        run: python scripts/fetch_news.py

      - name: Save news.json
        run: |
          if [ -n "$(git status --porcelain docs/news.json)" ]; then
            git config user.name "news-desk-bot"
            git config user.email "news-desk-bot@users.noreply.github.com"
            git add docs/news.json
            git commit -m "Update headlines"
            # If someone else pushed while this job ran, pick up their work and try again.
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            echo "Could not push after 4 tries" && exit 1
          else
            echo "No changes."
          fi
