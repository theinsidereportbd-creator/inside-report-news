<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels Maker — The Inside Report BD</title>
<meta name="theme-color" content="#0e1620">
<style>
:root { --bg:#f3f5f8; --panel:#fff; --ink:#14202e; --muted:#5a6877; --rule:#d8dee6; --accent:#1d4f91; --warn:#b7791f; }
html[data-theme="dark"] { --bg:#0e1620; --panel:#15202d; --ink:#e7edf4; --muted:#9aa8b8; --rule:#263444; --accent:#6aa6ec; --warn:#f2b84b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "IBM Plex Sans","Noto Sans Bengali",system-ui,sans-serif; }
html[lang="bn"] body { font-size:17px; }
.wrap { max-width:720px; margin:0 auto; padding:14px 16px 70px; }
.top { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
a, button, select, input, textarea, label.btn { font:inherit; color:inherit; }
.btn, button, select { border:1px solid var(--rule); background:var(--panel); border-radius:8px; padding:8px 14px; min-height:40px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn.primary, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
html[data-theme="dark"] .btn.primary, html[data-theme="dark"] button.primary { color:#0e1620; }
button:disabled { opacity:.5; cursor:default; }
h1 { font-size:22px; margin:6px 0 2px; }
h2 { font-size:15px; margin:0 0 10px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.card { background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:14px; margin-bottom:14px; }
.note { color:var(--muted); font-size:13px; margin:8px 0 0; }
input[type=text], textarea, select { width:100%; border:1px solid var(--rule); background:var(--bg); border-radius:8px; padding:10px 12px; }
textarea { min-height:170px; resize:vertical; }
label.f { display:block; margin:10px 0 4px; font-size:14px; color:var(--muted); }
.clip { display:grid; grid-template-columns:56px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--rule); }
.clip:first-child { border-top:0; }
.clip canvas { width:56px; height:56px; border-radius:6px; background:#0a1220; }
.clip .nm { overflow-wrap:anywhere; font-size:14px; }
.clip .ops { display:flex; gap:4px; }
.clip .ops button { min-height:36px; padding:4px 10px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.row > * { flex:1 1 140px; }
.top .row > * { flex:0 0 auto; }
#stage { display:none; width:100%; max-width:360px; margin:12px auto 0; border-radius:10px; background:#000; aspect-ratio:9/16; }
#bar { height:8px; border-radius:6px; background:var(--rule); overflow:hidden; margin-top:12px; display:none; }
#bar i { display:block; height:100%; width:0; background:var(--accent); }
#out { display:none; width:100%; max-width:360px; margin:12px auto 0; border-radius:10px; background:#000; }
.warn { color:var(--warn); }
.hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn" href="./" id="back"></a>
    <div class="row"><button type="button" id="lang"></button><button type="button" id="thm"></button></div>
  </div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <section class="card">
    <h2 id="s1"></h2>
    <label class="btn primary" for="files" id="pick"></label>
    <input type="file" id="files" accept="image/*,video/*" multiple class="hide">
    <p class="note" id="n1"></p>
    <div id="clips" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2 id="s2"></h2>
    <label class="f" id="lt"></label><input type="text" id="title" maxlength="120">
    <label class="f" id="lscr"></label><textarea id="script"></textarea>
    <p class="note" id="n2"></p>
  </section>

  <section class="card">
    <h2 id="s3"></h2>
    <label class="f" id="lv"></label><input type="file" id="voice" accept="audio/*,video/*">
    <p class="note" id="vinfo"></p>
    <div class="row">
      <div><label class="f" id="lp"></label><select id="preset"></select></div>
      <div><label class="f" id="lm"></label><select id="motion"></select></div>
      <div><label class="f" id="lso"></label><select id="sound"></select></div>
      <div><label class="f" id="lo"></label><select id="outro"></select></div>
    </div>
  </section>

  <section class="card">
    <h2 id="s4"></h2>
    <button type="button" class="primary" id="make" style="width:100%"></button>
    <div id="bar"><i></i></div>
    <p class="note" id="status"></p>
    <canvas id="stage" width="720" height="1280"></canvas>
    <video id="out" controls playsinline></video>
    <div style="margin-top:12px"><a class="btn primary hide" id="dl"></a></div>
    <p class="note" id="n4"></p>
  </section>
</div>

    g.fillStyle = "rgba(4,20,58,0.78)"; rr(g, 30, by, W - 60, bh, 18); g.fill();
    g.fillStyle = "#D2A53A"; g.fillRect(30, by + 14, 6, bh - 28);
    g.fillStyle = "#fff"; g.textAlign = "left";
    lines.forEach(function (l, i) { g.fillText(l, 54, by + 18 + fs * 1.0 + i * lh - 4); });
    g.restore();
    g.fillStyle = "#D2A53A"; g.fillRect(0, 0, W * (tm / st.total), 8);
  }
  function drawOutro(g, lt) {
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0B2A63"); gr.addColorStop(1, "#04143A");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    var a = ease(lt / 0.6); g.globalAlpha = a;
    if (seal.complete && seal.naturalWidth) g.drawImage(seal, W / 2 - 110, 380, 220, 220);
    g.textAlign = "center"; g.fillStyle = "#fff"; g.font = "800 50px " + FONT; g.fillText(t("out1"), W / 2, 700);
    g.fillStyle = "#D2A53A"; g.font = "700 34px " + FONT; g.fillText(t("out2"), W / 2, 765);
    g.globalAlpha = 1; g.textAlign = "left";
  }

  /* ---------- sound ---------- */
  function bgSound(ctx, out, kind, t0, total, vol) {
    if (kind === "none") return;
    var master = ctx.createGain(); master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(vol, t0 + 0.8);
    master.gain.setValueAtTime(vol, t0 + Math.max(0.9, total - 1.2)); master.gain.exponentialRampToValueAtTime(0.0001, t0 + total);
    master.connect(out);
    function env(g, tt, a, len, v) { g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), tt + a); g.gain.exponentialRampToValueAtTime(0.0001, tt + len); }
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240; lp.Q.value = 3;
    var dg = ctx.createGain(); dg.gain.value = kind === "low" ? 0.6 : 0.3; lp.connect(dg); dg.connect(master);
    [55, 55.7].forEach(function (f) { var o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(t0); o.stop(t0 + total + 0.2); });
    var tt;
    if (kind === "tick") { for (tt = 0.3; tt < total - 1; tt += 0.6) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.value = 1800; env(g, t0 + tt, 0.001, 0.03, 0.25); o.connect(g); g.connect(master); o.start(t0 + tt); o.stop(t0 + tt + 0.05); } }
    if (kind === "beat") { for (tt = 0.4; tt < total - 1; tt += 0.95) { [0, 0.22].forEach(function (d, k) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.setValueAtTime(70, t0 + tt + d); o.frequency.exponentialRampToValueAtTime(38, t0 + tt + d + 0.16); env(g, t0 + tt + d, 0.01, 0.22, k ? 0.5 : 0.8); o.connect(g); g.connect(master); o.start(t0 + tt + d); o.stop(t0 + tt + d + 0.3); }); } }
  }

  function pickMime() {
    var c = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    for (var i = 0; i < c.length; i++) { try { if (MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch (e) {} }
    return "";
  }

  /* ---------- make ---------- */
  $("make").addEventListener("click", function () {
    if (busy) return;
    var lines = $("script").value.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!items.length) { status(t("noImg"), true); return; }
    if (!lines.length) { status(t("noScr"), true); return; }
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { status(t("noRec"), true); return; }
    busy = true; $("make").disabled = true; $("dl").className = "btn primary hide"; $("out").style.display = "none";
    var preset = $("preset").value, motion = $("motion").value, soundKind = $("sound").value, outroOn = $("outro").value === "on";
    var LEAD = 0.3, n = lines.length, durs = [], i;
    var weights = lines.map(function (l) { return Math.max(8, l.length); }), sw = weights.reduce(function (a, b) { return a + b; }, 0);
    if (voiceBuf) {
      var speech = voiceBuf.duration + LEAD + 0.4;
      for (i = 0; i < n; i++) durs.push(Math.max(1.2, speech * weights[i] / sw));
    } else {
      for (i = 0; i < n; i++) durs.push(Math.min(7, Math.max(2.2, 1.6 + lines[i].length * 0.07)));
    }
    var modes = ["zin", "pan", "zout", "pan"];
    var segs = [], total = 0;
    for (i = 0; i < n; i++) {
      var pi = Math.min(items.length - 1, Math.floor(i * items.length / n));
      segs.push({ type: "scene", it: items[pi], text: lines[i], dur: durs[i], mode: motion === "mix" ? modes[i % 4] : motion, dir: i % 2 ? 1 : -1 });
    }
    if (outroOn) segs.push({ type: "outro", dur: OUTRO });
    segs.forEach(function (s) { s.start = total; total += s.dur; });
    var st = { preset: preset, kicker: t("k")[preset], title: $("title").value.trim(), total: total };

    var AC = window.AudioContext || window.webkitAudioContext, actx = new AC();
    var adest = actx.createMediaStreamDestination();
    var canvas = $("stage"), g = canvas.getContext("2d");
    canvas.style.display = "block"; $("bar").style.display = "block"; status(t("working"));
    var t0 = actx.currentTime + 0.2;
    bgSound(actx, adest, soundKind, t0, total, voiceBuf ? 0.18 : 0.6);
    if (voiceBuf) {
      var vs0 = actx.createBufferSource(), vg = actx.createGain(); vs0.buffer = voiceBuf; vg.gain.value = 1.0; vs0.connect(vg); vg.connect(adest); vs0.start(t0 + LEAD);
    }
    var vs = canvas.captureStream(FPS);
    adest.stream.getAudioTracks().forEach(function (tr) { vs.addTrack(tr); });
    var mime = pickMime(), rec;
    try { rec = new MediaRecorder(vs, mime ? { mimeType: mime, videoBitsPerSecond: 4000000, audioBitsPerSecond: 128000 } : {}); } catch (e) { rec = new MediaRecorder(vs); }
    var chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function () {
      var type = (rec.mimeType || mime || "video/webm").split(";")[0];
      var url = URL.createObjectURL(new Blob(chunks, { type: type }));
      var ext = /mp4/.test(type) ? "mp4" : "webm", d = new Date(), pad = function (x) { return (x < 10 ? "0" : "") + x; };
      var out = $("out"); out.src = url; out.style.display = "block";
      $("dl").href = url; $("dl").download = "reel-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + "." + ext; $("dl").className = "btn primary";
      status(t("done")); canvas.style.display = "none"; $("bar").style.display = "none";
      items.forEach(function (x) { if (x.video) { try { x.el.pause(); } catch (e) {} } });
      try { actx.close(); } catch (e) {} busy = false; $("make").disabled = false;
    };
    rec.start(250);
    var startMs = performance.now(), curK = -1;
    function frame() {
      var tm = (performance.now() - startMs) / 1000;
      if (tm >= total) { $("bar").firstChild.style.width = "100%"; setTimeout(function () { try { rec.stop(); } catch (e) {} }, 300); return; }
      var k = 0; while (k < segs.length - 1 && tm >= segs[k].start + segs[k].dur) k++;
      var s = segs[k], lt = tm - s.start;
      if (k !== curK) { if (segs[curK] && segs[curK].it && segs[curK].it.video && !(s.type === "scene" && lt < XF)) { try { segs[curK].it.el.pause(); } catch (e) {} } curK = k; if (s.it && s.it.video) { try { s.it.el.currentTime = 0; var pp = s.it.el.play(); if (pp && pp.catch) pp.catch(function () {}); } catch (e) {} } }
      if (k > 0 && lt >= XF && segs[k - 1].it && segs[k - 1].it.video) { try { segs[k - 1].it.el.pause(); } catch (e) {} }
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      if (s.type === "outro") drawOutro(g, lt);
      else {
        var prev = k > 0 && segs[k - 1].type === "scene" ? segs[k - 1] : null;
        if (prev && lt < XF) photo(g, prev, 1, 1, preset);
        photo(g, s, lt / s.dur, prev && lt < XF ? lt / XF : 1, preset);
        overlay(g, st, s, lt, tm);
      }
      $("bar").firstChild.style.width = Math.min(100, tm / total * 100) + "%";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });

  paint();
})();
</script>
