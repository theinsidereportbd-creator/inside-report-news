<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Maker — The Inside Report BD</title>
<meta name="theme-color" content="#0e1620">
<style>
:root { --bg:#f3f5f8; --panel:#fff; --ink:#14202e; --muted:#5a6877; --rule:#d8dee6; --accent:#1d4f91; }
html[data-theme="dark"] { --bg:#0e1620; --panel:#15202d; --ink:#e7edf4; --muted:#9aa8b8; --rule:#263444; --accent:#6aa6ec; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "IBM Plex Sans","Noto Sans Bengali",system-ui,sans-serif; }
html[lang="bn"] body { font-size:17px; }
.wrap { max-width:720px; margin:0 auto; padding:14px 16px 70px; }
.top { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; }
a, button, select, input, textarea, label.btn { font:inherit; color:inherit; }
.btn, button, select { border:1px solid var(--rule); background:var(--panel); border-radius:8px; padding:8px 14px; min-height:40px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn.primary, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
html[data-theme="dark"] .btn.primary, html[data-theme="dark"] button.primary { color:#0e1620; }
h1 { font-size:22px; margin:6px 0 2px; }
h2 { font-size:15px; margin:0 0 10px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.card { background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:14px; margin-bottom:14px; }
.note { color:var(--muted); font-size:13px; margin:8px 0 0; }
input[type=text], textarea, select { width:100%; border:1px solid var(--rule); background:var(--bg); border-radius:8px; padding:10px 12px; }
textarea { min-height:78px; resize:vertical; }
input[type=range] { width:100%; }
label.f { display:block; margin:10px 0 4px; font-size:14px; color:var(--muted); }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > * { flex:1 1 140px; }
#cv { display:block; width:auto; height:auto; max-width:100%; max-height:34vh; margin:0 auto; border-radius:8px; background:#000; border:1px solid var(--rule); }
.top { align-items:center; }
.top .row > * { flex:0 0 auto; }
.hide { display:none; }
.sticky { position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0; }
</style>
</head>
<body>

  <div class="top">
    <a class="btn" href="./" id="back"></a>
    <div class="row" style="flex:0 0 auto"><button type="button" id="lang"></button><button type="button" id="thm"></button></div>
  </div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <section class="card sticky"><canvas id="cv" width="1080" height="1350"></canvas></section>

  <section class="card">
    <h2 id="s1"></h2>
    <label class="btn primary" for="img" id="pick"></label>
    <input type="file" id="img" accept="image/*" class="hide">
    <button type="button" id="clr"></button>
    <label class="f" id="lbg"></label><select id="bgstyle"></select>
    <label class="f" id="lz"></label><input type="range" id="zoom" min="100" max="300" value="100">
    <div class="row"><div><label class="f" id="lx"></label><input type="range" id="px" min="-100" max="100" value="0"></div>
    <div><label class="f" id="ly"></label><input type="range" id="py" min="-100" max="100" value="0"></div></div>
    <label class="f" id="ld"></label><input type="range" id="dark" min="0" max="90" value="55">
  </section>

  <section class="card">
    <h2 id="s2"></h2>
    <label class="f" id="lt"></label><textarea id="title" maxlength="400"></textarea>
    <label class="f" id="ls"></label><input type="text" id="subt" maxlength="140">
    <label class="f" id="lsrc"></label><input type="text" id="src" maxlength="80">
  </section>

  <section class="card">
    <h2 id="sAI"></h2>
    <label class="f" id="laid"></label><textarea id="aidesc" style="min-height:70px"></textarea>
    <div class="row"><button type="button" id="aicopy"></button></div>
    <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.bing.com/images/create">Bing Image Creator ↗</a><a class="btn" target="_blank" rel="noopener" href="https://chatgpt.com/">ChatGPT ↗</a></div>
    <label class="f" id="llab"></label><select id="ailab"></select>
    <p class="note" id="ainote"></p>
  </section>

  <section class="card">
    <h2 id="sL"></h2>
    <label class="btn primary" for="logo" id="lpick"></label>
    <input type="file" id="logo" accept="image/*" class="hide">
    <button type="button" id="lclr"></button>
    <div class="row">
      <div><label class="f" id="lLpos"></label><select id="lpos"></select></div>
      <div><label class="f" id="lLsz"></label><input type="range" id="lsz" min="8" max="45" value="20"></div>
    </div>
    <div class="row"><div><label class="f" id="lLseal"></label><select id="sealon"></select></div></div>
  </section>

  <section class="card">
    <h2 id="s3"></h2>
    <div class="row">
      <div><label class="f" id="lp"></label><select id="preset"></select></div>
      <div><label class="f" id="lstamp"></label><select id="stamp"></select></div>
      <div><label class="f" id="lsz"></label><select id="size"></select></div>
      <div><label class="f" id="lanc"></label><select id="anchor"></select></div>
    </div>
  </section>

  <section class="card">
    <div class="row"><button type="button" class="primary" id="dl"></button><button type="button" id="share"></button></div>
    <p class="note" id="n"></p>
  </section>
</div>
