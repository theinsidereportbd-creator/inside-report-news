<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Studio — The Inside Report BD</title>
<meta name="theme-color" content="#0e1620">
<style>
:root { --bg:#f3f5f8; --panel:#fff; --ink:#14202e; --muted:#5a6877; --rule:#d8dee6; --accent:#1d4f91; --warn:#b7791f; --rec:#c8321e; }
html[data-theme="dark"] { --bg:#0e1620; --panel:#15202d; --ink:#e7edf4; --muted:#9aa8b8; --rule:#263444; --accent:#6aa6ec; --warn:#f2b84b; --rec:#ff6a52; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "IBM Plex Sans","Noto Sans Bengali",system-ui,sans-serif; }
html[lang="bn"] body { font-size:17px; }
.wrap { max-width:720px; margin:0 auto; padding:14px 16px 70px; }
.top { display:flex; gap:8px; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; }
a, button, select, input, textarea, label.btn { font:inherit; color:inherit; }
.btn, button, select { border:1px solid var(--rule); background:var(--panel); border-radius:8px; padding:8px 14px; min-height:42px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn.primary, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
html[data-theme="dark"] .btn.primary, html[data-theme="dark"] button.primary { color:#0e1620; }
button.rec { background:var(--rec); border-color:var(--rec); color:#fff; font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
h1 { font-size:22px; margin:6px 0 2px; }
h2 { font-size:15px; margin:0 0 10px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
.card { background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:14px; margin-bottom:14px; }
.note { color:var(--muted); font-size:13px; margin:8px 0 0; }
.warn { color:var(--warn); }
textarea, select, input[type=file] { width:100%; border:1px solid var(--rule); background:var(--bg); border-radius:8px; padding:10px 12px; }
textarea { min-height:170px; resize:vertical; line-height:1.7; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
.row > * { flex:1 1 130px; }
label.f { display:block; margin:10px 0 4px; font-size:14px; color:var(--muted); }
audio { width:100%; margin-top:8px; }
.live { color:var(--rec); font-weight:700; }
#interim { color:var(--muted); font-style:italic; min-height:1.4em; }
#tp { position:fixed; inset:0; background:#04143A; color:#fff; z-index:50; display:none; flex-direction:column; }
#tpTop { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:10px 14px; background:#071E4A; }
#tpView { flex:1; overflow:hidden; position:relative; }
#tpText { position:absolute; left:0; right:0; top:0; padding:35vh 20px 80vh; font-weight:700; line-height:1.7; text-align:center; white-space:pre-wrap; will-change:transform; }
#tpLine { position:absolute; left:0; right:0; top:35vh; height:3px; background:#D2A53A; opacity:.7; }
#tpCount { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:110px; font-weight:800; color:#D2A53A; background:rgba(4,20,58,.85); }
.hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn" href="./" id="back"></a>
    <div class="row" style="margin:0;flex:0 0 auto"><button type="button" id="lang"></button><button type="button" id="thm"></button></div>
  </div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <section class="card">
    <h2 id="s1"></h2>
    <textarea id="script"></textarea>
    <div class="row">
      <select id="dlang"><option value="bn-BD"></option><option value="en-US"></option></select>
      <button type="button" id="dict"></button>
    </div>
    <div class="row"><button type="button" id="copy"></button><button type="button" id="clear"></button></div>
    <p class="note" id="interim"></p>
    <p class="note" id="n1"></p>
  </section>

  <section class="card">
    <h2 id="s2"></h2>
    <div class="row">
      <div><label class="f" id="lspd"></label><input type="range" id="spd" min="20" max="140" value="55" style="width:100%"></div>
      <div><label class="f" id="lfs"></label><input type="range" id="fs" min="26" max="60" value="38" style="width:100%"></div>
    </div>
    <div class="row"><button type="button" class="rec" id="recbtn"></button></div>
    <p class="note" id="n2"></p>
  </section>

  <section class="card">
    <h2 id="s3"></h2>
    <label class="f" id="lsrc"></label>
    <select id="source"></select>
    <div id="fileRow" class="hide"><label class="f" id="lfile"></label><input type="file" id="afile" accept="audio/*,video/*"></div>
    <label class="f" id="llvl"></label>
    <select id="level"></select>
    <div class="row"><button type="button" class="primary" id="clean"></button></div>
    <p class="note" id="cstat"></p>
    <div id="res" class="hide">
      <label class="f" id="lbef"></label><audio id="aBefore" controls></audio>
      <label class="f" id="laft"></label><audio id="aAfter" controls></audio>
      <div class="row"><a class="btn primary" id="dl"></a></div>
    </div>
    <p class="note" id="n3"></p>
  </section>
</div>

<div id="tp">
  <div id="tpTop"><span id="tpTime" class="live">● 00:00</span><div style="display:flex;gap:8px"><button type="button" id="tpPause"></button><button type="button" class="rec" id="tpStop"></button></div></div>
  <div id="tpView"><div id="tpText"></div><div id="tpLine"></div><div id="tpCount"></div></div>
</div>

<script>

  var T = {

      s1: "১. স্ক্রিপ্ট", ph: "এখানে স্ক্রিপ্ট লিখুন, পেস্ট করুন, বা নিচের মাইক চেপে বলুন…", dBn: "বাংলা", dEn: "English",
      dictOn: "🗣️ বলা শুরু করুন", dictOff: "⏹ বলা থামান", copy: "📋 কপি", clear: "🗑 মুছুন", copied: "কপি হয়েছে ✓",
      n1: "বলা লেখায় রূপ দিতে ইন্টারনেট লাগে, আর আপনার কণ্ঠ Google-এর সার্ভারে যায়। সংবেদনশীল সূত্রের কিছু বলবেন না। নাম, জায়গা আর সংখ্যা ভুল হতে পারে, তাই লেখাটা পড়ে ঠিক করে নিন।",

      n2: "রেকর্ড চাপলে ৩-২-১ গোনা হবে, তারপর লেখা ধীরে ধীরে ওপরে উঠবে। সোনালি রেখার কাছে যে লাইন, সেটা পড়ুন। ফোন মুখের কাছে (২০-৩০ সেমি), শান্ত ঘরে রাখুন।",
      pause: "⏸ থামান", resume: "▶ চালান", stop: "⏹ শেষ", noScript: "আগে স্ক্রিপ্ট লিখুন।", micErr: "মাইক পাওয়া যায়নি। অনুমতি দিন।",

    en: { back: "← News desk", h1: "🎙️ Voice studio", sub: "Dictate text, read a script in your own voice, and clean up the audio.",
      s1: "1. Script", ph: "Type or paste a script here, or tap the mic below and speak…", dBn: "Bangla", dEn: "English",
      dictOn: "🗣️ Start speaking", dictOff: "⏹ Stop", copy: "📋 Copy", clear: "🗑 Clear", copied: "Copied ✓",
      n1: "Speech-to-text needs internet and your voice goes to Google's servers. Don't dictate sensitive source material. Names, places and numbers can be wrong, so proofread.",
      dNo: "Speech-to-text isn't available in this browser. Use Android Chrome.", dErr: "Mic or network problem. Check mic permission and internet.", listening: "Listening…",
      s2: "2. Record from the script", lspd: "Reading speed", lfs: "Text size", rec: "🎙️ Start recording (teleprompter)",
      n2: "A 3-2-1 countdown, then the text scrolls up. Read the line at the gold marker. Hold the phone 20–30 cm away in a quiet room.",
      pause: "⏸ Pause", resume: "▶ Resume", stop: "⏹ Done", noScript: "Write a script first.", micErr: "Microphone not available. Allow permission.",
      s3: "3. Audio cleanup", lsrc: "Which audio?", src1: "Just recorded", src2: "File from phone", lfile: "Audio file", llvl: "Cleanup strength",
      lv: { light: "Light (most natural)", normal: "Medium (recommended)", strong: "Strong (noisy rooms)" },
      clean: "🧹 Clean audio", noAudio: "Record something or choose a file first.", working: "Cleaning… please wait", done: "Done ✓ Have a listen.", decErr: "Couldn't read this file.",
      lbef: "Before", laft: "After (cleaned)", dl: "⬇ Download cleaned audio (WAV)",

  };
  function t(k) { return T[lang][k]; }

  var rawBlob = null, listening = false, recog = null, base = "";

  function paint() {
    document.documentElement.lang = lang;

    var l = $("level"), cl = l.value || "normal"; l.textContent = "";

    $("fileRow").className = $("source").value === "file" ? "" : "hide";
    $("lang").textContent = lang === "bn" ? "English" : "বাংলা";
    $("thm").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  }

  /* ---------- Dictation ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    base = $("script").value;

  /* ---------- Cleanup ---------- */
  $("source").addEventListener("change", function () { $("fileRow").className = this.value === "file" ? "" : "hide"; });
  $("afile").addEventListener("change", function () { if (this.files[0]) { $("aBefore").src = URL.createObjectURL(this.files[0]); } });

  function writeWav(samples, sr) {
    var n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function s(o, str) { for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    s(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); s(8, "WAVE"); s(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data"); v.setUint32(40, n * 2, true);

  function toMono(ab) {

    return out;
  }
  function gate(x, sr, amount) {

    var sorted = Array.prototype.slice.call(rms).sort(function (a, b) { return a - b; });
    var floor = sorted[Math.floor(nf * 0.12)] || 1e-5, peakish = sorted[Math.floor(nf * 0.9)] || 1e-3;
    var thr = Math.min(floor * amount.k, peakish * 0.5), gmin = amount.g;
    var g = 1, aA = Math.exp(-1 / (sr * 0.008)), aR = Math.exp(-1 / (sr * 0.18)), hold = 0, out = new Float32Array(x.length);

      else if (hold > 0) { hold--; target = 1; }
      for (j = 0; j < fl; j++) { var idx = i * fl + j; g = target > g ? target + (g - target) * aA : target + (g - target) * aR; out[idx] = x[idx] * g; }
    }
    for (i = nf * fl; i < x.length; i++) out[i] = x[i] * g;
    return out;
  }
  function process(ab, level) {
    var cfg = { light: { k: 2.2, g: 0.45 }, normal: { k: 2.8, g: 0.2 }, strong: { k: 3.6, g: 0.08 } }[level] || { k: 2.8, g: 0.2 };
    var sr = ab.sampleRate, mono = toMono(ab);
    var oc1 = new OfflineAudioContext(1, mono.length, sr), b = oc1.createBuffer(1, mono.length, sr); b.copyToChannel(mono, 0);
    var src = oc1.createBufferSource(); src.buffer = b;
    var hp = oc1.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 90; hp.Q.value = 0.7;
    var hp2 = oc1.createBiquadFilter(); hp2.type = "highpass"; hp2.frequency.value = 90; hp2.Q.value = 0.7;
    var lp = oc1.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = level === "strong" ? 7500 : 10500;
    var pk = oc1.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = 3000; pk.gain.value = 2; pk.Q.value = 0.9;
    src.connect(hp); hp.connect(hp2); hp2.connect(lp); lp.connect(pk); pk.connect(oc1.destination); src.start();
    return oc1.startRendering().then(function (r1) {
      var gated = gate(r1.getChannelData(0), sr, cfg);
      var oc2 = new OfflineAudioContext(1, gated.length, sr), b2 = oc2.createBuffer(1, gated.length, sr); b2.copyToChannel(gated, 0);
      var s2 = oc2.createBufferSource(); s2.buffer = b2;
      var cp = oc2.createDynamicsCompressor(); cp.threshold.value = -26; cp.knee.value = 12; cp.ratio.value = 3.5; cp.attack.value = 0.006; cp.release.value = 0.16;
      s2.connect(cp); cp.connect(oc2.destination); s2.start();
      return oc2.startRendering();
    }).then(function (r2) {
      var d = r2.getChannelData(0), peak = 0, i;
      for (i = 0; i < d.length; i++) { var a = Math.abs(d[i]); if (a > peak) peak = a; }
      var gain = peak > 0 ? 0.89 / peak : 1, out = new Float32Array(d.length);
      for (i = 0; i < d.length; i++) out[i] = d[i] * gain;
      return writeWav(out, sr);
    });
  }
  $("clean").addEventListener("click", function () {
    var useFile = $("source").value === "file", blob = useFile ? $("afile").files[0] : rawBlob;
    if (!blob) { $("cstat").className = "note warn"; $("cstat").textContent = t("noAudio"); return; }
    $("clean").disabled = true; $("cstat").className = "note"; $("cstat").textContent = t("working"); $("res").className = "hide";
    var AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    blob.arrayBuffer().then(function (ab) { return new Promise(function (res, rej) { ctx.decodeAudioData(ab, res, rej); }); })
      .then(function (buf) { try { ctx.close(); } catch (e) {} return process(buf, $("level").value); })
      .then(function (wav) {
        var url = URL.createObjectURL(wav), d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
        $("aAfter").src = url; $("dl").href = url; $("dl").download = "inside-report-voice-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".wav";
        $("res").className = ""; $("cstat").textContent = t("done");
      })
      .catch(function () { $("cstat").className = "note warn"; $("cstat").textContent = t("decErr"); })
      .then(function () { $("clean").disabled = false; });
  });

  $("lang").addEventListener("click", function () { lang = lang === "bn" ? "en" : "bn"; store("iir-lang", lang); paint(); });
  $("thm").addEventListener("click", function () {
    var d = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", d); store("iir-theme", d); paint();
  });
  document.documentElement.setAttribute("data-theme", store("iir-theme") === "light" ? "light" : "dark");
  paint();
})();
